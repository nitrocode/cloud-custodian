- id: c7n-validate
  name: cloud custodian validate
  description: Validates all Cloud Custodian policy files.
  entry: custodian validate
  language: python
  files: policies/.*\.y?ml$
- id: c7n-org-validate
  name: c7n-org policy validate
  description: Validates Cloud Custodian policy files using c7n-org.
  entry: c7n-org validate -f
  language: python
  files: policies/.*\.y?ml$
